name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (X.Y.Z, must match .service/version.txt)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: tag '$TAG' is not a valid X.Y.Z version."
            exit 1
          fi

      - name: Verify version matches version.txt
        run: |
          VERSION=$(tr -d '\r' < .service/version.txt)
          if [ "$VERSION" != "$TAG" ]; then
            echo "Error: tag '$TAG' does not match .service/version.txt ('$VERSION')"
            exit 1
          fi

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo $VERSION_ID)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell tar rar

      - name: Run pre-flight validation
        run: pwsh -NoProfile -File tests/Test-Build.ps1

      - name: Prepare clean release bundle
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Version "$env:TAG" -OutputDirectory "$PWD"

      - name: Create archives
        run: |
          NAME="zapret-discord-youtube-${TAG}"

          test -s "${NAME}.zip" # already created with UTF-8 names by Build-Release.ps1
          rar a -idq "${NAME}.rar" "$NAME"
          tar --owner=0 --group=0 -czf "${NAME}.tar.gz" "$NAME"

      - name: Create and verify SHA256 manifest
        run: |
          NAME="zapret-discord-youtube-${TAG}"
          sha256sum "${NAME}.zip" "${NAME}.rar" "${NAME}.tar.gz" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Update VirusTotal docs (auto)
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash -LiteralPath "zapret-discord-youtube-$env:TAG.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "ZIP $env:TAG hash $zipHash"
          ./tools/Update-VirusTotalDocs.ps1 -Version "$env:TAG"
          if (git status --porcelain README.md assets/screenshots/virustotal-links.html) {
            git config user.name "NewZapret Release Bot"
            git config user.email "release-bot@users.noreply.github.com"
            git add README.md assets/screenshots/virustotal-links.html
            git commit -m "docs: VirusTotal $env:TAG — auto-update hashes"
            git push origin HEAD:main
            Write-Host "VirusTotal docs pushed"
          } else { Write-Host "VirusTotal docs already current" }

      - name: Generate release notes from CHANGELOG
        shell: bash
        run: |
          TAG="$TAG"
          NOTES=$(sed -n "/^## $TAG/,/^## /p" CHANGELOG.md | sed '1d;$d')
          if [ -z "$NOTES" ]; then NOTES="Релиз $TAG — см. CHANGELOG.md"; fi
          {
            echo "### Что изменилось в $TAG"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo "SHA256 — в SHA256SUMS.txt"
          } > release_notes.md
          cat release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            zapret-discord-youtube-${{ env.TAG }}.zip
            zapret-discord-youtube-${{ env.TAG }}.rar
            zapret-discord-youtube-${{ env.TAG }}.tar.gz
            SHA256SUMS.txt
