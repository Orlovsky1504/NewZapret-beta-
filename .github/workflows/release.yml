name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (X.Y.Z, must match .service/version.txt)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: tag '$TAG' is not a valid X.Y.Z version."
            exit 1
          fi

      - name: Verify version matches version.txt
        run: |
          VERSION=$(tr -d '\r' < .service/version.txt)
          if [ "$VERSION" != "$TAG" ]; then
            echo "Error: tag '$TAG' does not match .service/version.txt ('$VERSION')"
            exit 1
          fi

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo $VERSION_ID)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell tar rar

      - name: Run pre-flight validation
        run: pwsh -NoProfile -File tests/Test-Build.ps1

      - name: Prepare clean release bundle
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Version "$env:TAG" -OutputDirectory "$PWD"

      - name: Create archives
        run: |
          NAME="zapret-discord-youtube-${TAG}"

          test -s "${NAME}.zip" # already created with UTF-8 names by Build-Release.ps1
          rar a -idq "${NAME}.rar" "$NAME"
          tar --owner=0 --group=0 -czf "${NAME}.tar.gz" "$NAME"

      - name: Create and verify SHA256 manifest
        run: |
          NAME="zapret-discord-youtube-${TAG}"
          sha256sum "${NAME}.zip" "${NAME}.rar" "${NAME}.tar.gz" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes from CHANGELOG
        shell: bash
        run: |
          TAG="$TAG"
          # Снимаем BOM если есть и нормализуем CRLF -> LF для sed
          sed -i '1s/^\xEF\xBB\xBF//' CHANGELOG.md
          # Пробуем заголовок вида "## 3.0.17 — ..." (с длинным тире)
          NOTES=$(sed -n "/^## $TAG —/,/^## /p" CHANGELOG.md | sed '1d;$d')
          # Фолбэк: старый формат "## 3.0.17" без тире
          if [ -z "$(echo "$NOTES" | tr -d ' \t\r\n')" ]; then
            NOTES=$(sed -n "/^## $TAG/,/^## /p" CHANGELOG.md | sed '1d;$d')
          fi
          if [ -z "$(echo "$NOTES" | tr -d ' \t\r\n')" ]; then
            NOTES="Исправления и улучшения. Полный список изменений — в файле CHANGELOG.md внутри архива."
          fi
          {
            echo "### Что нового в $TAG"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo "Проверка: \`certutil -hashfile zapret-discord-youtube-$TAG.zip SHA256\` — сверьте с SHA256SUMS.txt"
          } > release_notes.md
          cat release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            zapret-discord-youtube-${{ env.TAG }}.zip
            zapret-discord-youtube-${{ env.TAG }}.rar
            zapret-discord-youtube-${{ env.TAG }}.tar.gz
            SHA256SUMS.txt

      # Всё ниже выполняется ТОЛЬКО после того, как релиз создан. Клиенты читают update-manifest.json
      # из main, поэтому он публикуется последним: пока ZIP не опубликован и его хеш не сверен,
      # манифест продолжает указывать на предыдущий (существующий) релиз.
      - name: Verify published ZIP matches the local build
        run: |
          NAME="zapret-discord-youtube-${TAG}"
          URL="https://github.com/Orlovsky1504/OpenZapret/releases/download/${TAG}/${NAME}.zip"
          EXPECTED=$(awk -v n="${NAME}.zip" '$2 == n { print $1 }' SHA256SUMS.txt)
          if [ -z "$EXPECTED" ]; then echo "No SHA-256 for ${NAME}.zip in SHA256SUMS.txt"; exit 1; fi
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --retry 3 -o published.zip "$URL"; then ok=1; break; fi
            echo "Release asset not downloadable yet (attempt $attempt), retrying..."
            sleep 10
          done
          if [ "$ok" != 1 ]; then echo "Could not download $URL"; exit 1; fi
          ACTUAL=$(sha256sum published.zip | cut -d' ' -f1)
          echo "expected=$EXPECTED"
          echo "published=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "Published ZIP hash differs from the local build"; exit 1; fi
          rm -f published.zip
          echo "ZIP_SHA=$EXPECTED" >> "$GITHUB_ENV"

      - name: Publish update-manifest.json (last step)
        run: |
          command -v jq >/dev/null || sudo apt-get install -y -qq jq
          NAME="zapret-discord-youtube-${TAG}"
          ZIP_URL="https://github.com/Orlovsky1504/OpenZapret/releases/download/${TAG}/${NAME}.zip"
          TITLE=$(grep -m1 "^## ${TAG} " CHANGELOG.md | tr -d '\r' | sed -E 's/^## +[^ ]+ +[^ ]+ +[^ ]+ +[^ ]+ +//' || true)
          jq --arg sha "$ZIP_SHA" --arg ver "$TAG" --arg url "$ZIP_URL" --arg date "$(date -u +%F)" --arg note "$TITLE" \
            '.sha256 = $sha | .version = $ver | .zipUrl = $url | .published = $date | (if $note != "" then .notes = [$note] else . end)' \
            update-manifest.json > "$RUNNER_TEMP/update-manifest.json"
          mv "$RUNNER_TEMP/update-manifest.json" update-manifest.json
          cat update-manifest.json
          git config user.name "NewZapret Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add update-manifest.json
          if git diff --cached --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git commit -m "chore: sync manifest ${TAG} ${ZIP_SHA}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then echo "manifest published"; exit 0; fi
            sleep 5
          done
          echo "Could not push the manifest"
          exit 1

      - name: Update VirusTotal docs (non-critical)
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/Update-VirusTotalDocs.ps1 -Version "$env:TAG"
          if (git status --porcelain README.md assets/screenshots/virustotal-links.html) {
            git config user.name "NewZapret Release Bot"
            git config user.email "release-bot@users.noreply.github.com"
            git add README.md assets/screenshots/virustotal-links.html
            git commit -m "docs: VirusTotal $env:TAG - auto-update hashes"
            for ($i = 1; $i -le 3; $i++) {
              git pull --rebase origin main
              git push origin HEAD:main
              if ($LASTEXITCODE -eq 0) { Write-Host "VirusTotal docs pushed"; break }
              Start-Sleep -Seconds 5
            }
          } else { Write-Host "VirusTotal docs already current" }
