name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (X.Y.Z, must match .service/version.txt)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: tag '$TAG' is not a valid X.Y.Z version."
            exit 1
          fi

      - name: Verify version matches version.txt
        run: |
          VERSION=$(tr -d '\r' < .service/version.txt)
          if [ "$VERSION" != "$TAG" ]; then
            echo "Error: tag '$TAG' does not match .service/version.txt ('$VERSION')"
            exit 1
          fi

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo $VERSION_ID)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell tar rar

      - name: Run pre-flight validation
        run: pwsh -NoProfile -File tests/Test-Build.ps1

      - name: Prepare clean release bundle
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Version "$env:TAG" -OutputDirectory "$PWD"

      - name: Create archives
        run: |
          NAME="zapret-discord-youtube-${TAG}"

          test -s "${NAME}.zip" # already created with UTF-8 names by Build-Release.ps1
          rar a -idq "${NAME}.rar" "$NAME"
          tar --owner=0 --group=0 -czf "${NAME}.tar.gz" "$NAME"

      - name: Create and verify SHA256 manifest
        run: |
          NAME="zapret-discord-youtube-${TAG}"
          sha256sum "${NAME}.zip" "${NAME}.rar" "${NAME}.tar.gz" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            zapret-discord-youtube-${{ env.TAG }}.zip
            zapret-discord-youtube-${{ env.TAG }}.rar
            zapret-discord-youtube-${{ env.TAG }}.tar.gz
            SHA256SUMS.txt
