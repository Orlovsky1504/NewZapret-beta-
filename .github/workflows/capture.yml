name: Capture Proof Screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'Zapret-Control.ps1'
      - 'tools/Capture-Screenshots.ps1'
      - '.github/workflows/capture.yml'

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render WPF to PNG (PowerShell 5.1 STA)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -STA -NoProfile -File tools/Capture-Screenshots.ps1 -OutDir assets/screenshots
          dir assets/screenshots\ci-*.png | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshots
          path: assets/screenshots/ci-*.png
          retention-days: 7

      # Commit is done manually via token — artifact is enough for proof (push from actions forbidden without PAT)
