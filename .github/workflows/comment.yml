name: Auto comment on new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new issue
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            # Пожалуйста, ознакомьтесь с README. В нем есть ответы на распространенные вопросы и описания файлов: [README.md](https://github.com/Flowseal/zapret-discord-youtube/blob/main/README.md)

            ### Прежде всего
            - Запустите `zapret.bat` и выберите пункт `Run Diagnostics`, чтобы проверить на конфликтующие сервисы.
                - Если у вас проблемы с запуском Discord, то в конце согласитесь на очистку кэша.
            - Проверьте обновление **Hosts File** (в `zapret.bat`).
            - Если не работает / перестала работать стратегия, то попробуйте другие.
            - Если у вас проблемы с чем-то, что корректно работает без zapret, то убедитесь, что `Game Filter` (disabled) в `zapret.bat`. Если это не помогло, то в `zapret.bat` выберите `IPSet Filter`, чтобы он стал (none)

            ##
            ### Проблемы с файлами? (не открываются / нет стратегий в Install Service и т.д.)
            - Если открывается `zapret.bat`, то:
                - `zapret.bat` -> `Remove Services`
                - `zapret.bat` -> `Run Diagnostics` (если есть ошибки - устраните их) -> в конце Y
            - Убедитесь, что процесс winws.exe не запущен (выключите его, если запущен)
            - Удалите папку с запретом
            - Перезапустите устройство
            - Скачайте последнюю версию [со страницы релизов](https://github.com/Flowseal/zapret-discord-youtube/releases) (`zapret-discord-youtube-...`)
            - Нажмите пкм по архиву -> свойства. Если снизу справа есть галочка разблокировать, то нажмите на неё -> применить -> ОК
            - Распакуйте в новую папку в корне диска (без спец. символов, кириллицы и пробелов)
            - Откройте `zapret.bat` -> `13. Auto-Select Best Strategy` — zapret сам проверит все стратегии и поставит лучшую на автозапуск (либо вручную: `Run Strategy Tests` -> Standard -> All)
            - Либо выберите стратегию сами и поставьте на автозапуск: `zapret.bat` -> `Install Service`

            ##
            ### Не работает игра / сервис / сайт?
            - Проверьте работоспособность без обхода:
                - **Работает:**  
                    - Домен можно удалить в `lists/list-general-user.txt`, если он там присутствует  
                    Либо же добавить домен в `lists/list-exclude-user.txt` (*поддомены автоматически учитываются*)  
                    - Попробуйте выключить `Game Filter` в `zapret.bat` (требуется перезапуск обхода или переустановка сервиса) и `IPSet Filter` (чтобы стал **none**)
                
                - **Не работает: пробуйте другие стратегии.** Если не помогло, то:  
                *Если это сайт*, то добавьте домен в `lists/list-general-user.txt` (поддомены автоматически учитываются).  
                *Если это игра*, то попробуйте включить `Game Filter` и `IPSet Filter` (чтобы стал **loaded**, если не поможет то **any**) в `zapret.bat` (требуется перезапуск обхода или переустановка сервиса).

                    **Пробуйте разные стратегии после внесения изменений в случае, если это не сработало**

            - Если проблема связана с игрой и решения выше не помогли, то:
                    1. **Закройте** этот issue.
                    2. **Создайте новую (или найдите уже существующую) ветку обсуждений** в разделе [**Discussions**](https://github.com/Flowseal/zapret-discord-youtube/discussions), подробно опишите свою проблему и ждите помощи от других игроков.
                *Давайте будем честны*: Игр много. Как и вы, никто и никогда не читает уже существующие чужие issues, а вероятность найти решение проблемы в разделе [**Discussions**](https://github.com/Flowseal/zapret-discord-youtube/discussions) — выше.

            # Пожалуйста, сообщите следующую информацию о Вашей проблеме, чтобы Вам помогли решить её быстрее:
            - отправьте версию Windows, на которой словили ошибку
            - отправьте результаты тестирования конфигураций zapret в виде файла
            - отправьте состояние `IPSet`/`Game` Filter и активных фейков 
            - отправьте полный скриншот диагностики zapret
            - отправьте скриншот настроенного [Безопасного DNS (Secure DNS)](https://github.com/Flowseal/zapret-discord-youtube#%EF%B8%8F%D0%B8%D1%81%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5) в ОС/браузере